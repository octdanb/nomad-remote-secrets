# The onepassword Nomad secret provider plugin. Credentials are NOT laid
# down here: /etc/nomad-secret-onepassword/{config.env,token} comes from
# first-boot user data (AMI) or your host-specific provisioning (bare
# metal), so the same role output is safe to bake into an image.
- name: Install plugin binary
  ansible.builtin.copy:
    src: "{{ onepassword_plugin_binary }}"
    dest: "{{ nomad_plugin_dir }}/secrets/onepassword"
    mode: "0755"

- name: Plugin config directory (root-only)
  ansible.builtin.file:
    path: /etc/nomad-secret-onepassword
    state: directory
    mode: "0700"

- name: Verify the plugin fingerprints
  ansible.builtin.command: "{{ nomad_plugin_dir }}/secrets/onepassword fingerprint"
  register: onepassword_fingerprint
  changed_when: false
  failed_when: "'\"type\"' not in onepassword_fingerprint.stdout"
