# Image-build playbook, driven by Packer's ansible provisioner (see
# packer/nomad-client.pkr.hcl). The roles are deliberately host-agnostic so
# the same roles provision bare-metal / long-lived EC2 instances:
#
#   ansible-playbook -i inventory image.yml \
#     -e nomad_version=1.11.0 -e traefik_version=3.5.2 \
#     -e onepassword_plugin_binary=/path/to/onepassword_linux_amd64
#
# For an AMI, services are left disabled (first-boot user data configures
# and enables them). On bare metal, set e.g. -e nomad_service_enabled=true
# after laying down your own /etc/nomad.d/runtime.hcl.
- name: Provision Nomad client node
  hosts: all
  become: true
  roles:
    - base
    - docker
    - nomad
    - onepassword_plugin
    - traefik
