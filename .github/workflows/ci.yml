name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Nomad version used by the single-version e2e jobs (AWS, UI, real-1Password).
  # The `e2e` job below sweeps a matrix to establish the supported range.
  # Must be a pure-OSS release (…/nomad/<v>/…): 1.11.7+ exist only as +ent.
  NOMAD_DEFAULT: "1.11.3"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: make release
      - uses: actions/upload-artifact@v4
        with:
          name: remote-secrets-binaries
          path: bin/

  # Hermetic end-to-end across a matrix of Nomad versions, so the supported
  # range is verified on every push. The secret-provider API landed in Nomad
  # 1.11.0, so that is the floor; 1.10.x is included as an allowed-to-fail
  # check that documents the boundary (its job spec lacks the `secret` block).
  e2e:
    runs-on: ubuntu-latest
    needs: test
    continue-on-error: ${{ !matrix.required }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { nomad: "1.10.5", required: false } # unsupported: no secret provider (latest 1.10 OSS)
          - { nomad: "1.11.0", required: true } # minimum supported
          - { nomad: "1.11.3", required: true } # latest 1.11.x OSS
          - { nomad: "2.0.4", required: true } # latest major OSS
    name: e2e (nomad ${{ matrix.nomad }}${{ !matrix.required && ' (unsupported)' || '' }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Nomad ${{ matrix.nomad }}
        run: |
          curl -fsSL -o /tmp/nomad.zip \
            "https://releases.hashicorp.com/nomad/${{ matrix.nomad }}/nomad_${{ matrix.nomad }}_linux_amd64.zip"
          sudo unzip -o /tmp/nomad.zip -d /usr/local/bin
          nomad --version
      - name: Run e2e (fake 1Password, docker driver)
        run: ./e2e/run.sh

  # Hermetic AWS end-to-end: a real Nomad agent + Docker driver resolve
  # aws-ssm:/aws-sm: secret blocks through localstack (dummy creds, fork-safe).
  aws-e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Nomad and awscli
        run: |
          curl -fsSL -o /tmp/nomad.zip \
            "https://releases.hashicorp.com/nomad/${NOMAD_DEFAULT}/nomad_${NOMAD_DEFAULT}_linux_amd64.zip"
          sudo unzip -o /tmp/nomad.zip -d /usr/local/bin
          sudo apt-get update && sudo apt-get install -y awscli
          nomad --version
      - name: Run aws e2e (localstack SSM + Secrets Manager, docker driver)
        run: ./e2e/aws/run.sh

  # Drives the Nomad web UI with Playwright to prove resolved secret values
  # never render in the console (hermetic, fake 1Password Connect).
  ui-e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Nomad
        run: |
          curl -fsSL -o /tmp/nomad.zip \
            "https://releases.hashicorp.com/nomad/${NOMAD_DEFAULT}/nomad_${NOMAD_DEFAULT}_linux_amd64.zip"
          sudo unzip -o /tmp/nomad.zip -d /usr/local/bin
          nomad --version
      - name: Run UI e2e (fake 1Password, Playwright)
        run: ./e2e/ui/run.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/ui/playwright-report/

  # Same round-trip against a REAL 1Password vault via a service account.
  # Enable by setting repo variable OP_E2E_ENABLED=true — see e2e/README.md
  # for the vault/item/secret setup.
  e2e-real-1password:
    if: ${{ vars.OP_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: e2e
    env:
      E2E_MODE: real
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_E2E_SERVICE_ACCOUNT_TOKEN }}
      OP_E2E_SECRET_PATH: ${{ vars.OP_E2E_SECRET_PATH }}
      OP_E2E_EXPECTED: ${{ vars.OP_E2E_EXPECTED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install Nomad
        run: |
          curl -fsSL -o /tmp/nomad.zip \
            "https://releases.hashicorp.com/nomad/${NOMAD_DEFAULT}/nomad_${NOMAD_DEFAULT}_linux_amd64.zip"
          sudo unzip -o /tmp/nomad.zip -d /usr/local/bin
          nomad --version
      - name: Run e2e (real 1Password, docker driver)
        run: ./e2e/run.sh
