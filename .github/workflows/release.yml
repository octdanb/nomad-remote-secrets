name: Release

# Publishes the compiled multi-provider secret plugin as GitHub Release
# assets. The provider name is `remote-secrets` (the reference scheme selects the
# backend). Trigger by pushing a semver tag that matches the plugin Version:
#
#   git tag v0.5.0 && git push origin v0.5.0
#
# Produces remote-secrets_linux_amd64, remote-secrets_linux_arm64, and a SHA256SUMS file
# that Ansible can pin against with `checksum:`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Verify tag matches plugin.Version
        run: |
          version=$(grep -oE 'Version = "[0-9]+\.[0-9]+\.[0-9]+"' internal/plugin/plugin.go | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "release tag $GITHUB_REF_NAME does not match plugin.Version $version" >&2
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build linux binaries
        run: make release

      - name: Checksums
        working-directory: bin
        run: sha256sum remote-secrets_linux_amd64 remote-secrets_linux_arm64 > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            bin/remote-secrets_linux_amd64
            bin/remote-secrets_linux_arm64
            bin/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
